[versions]
quarkus = "3.40.1.1"
spotless = "8.10.4"
archunit = "1.5.1"
google-java-format = "1.36.1"

[libraries]
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version = "6.1.3" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher", version = "6.1.3" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version = "2.21.7" }
quarkus-bom = { module = "io.quarkus.platform:quarkus-bom", version.ref = "quarkus" }
archunit = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }

[plugins]
quarkus = { id = "io.quarkus", version.ref = "quarkus" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
