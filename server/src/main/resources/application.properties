quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.enabled=false
quarkus.datasource.jdbc.url=${APP_DB_JDBC_URL:jdbc:postgresql://localhost:5432/starter}
quarkus.datasource.username=${APP_DB_USERNAME:app_runtime}
quarkus.datasource.password=${APP_DB_PASSWORD:}
quarkus.datasource.jdbc.max-size=10
quarkus.datasource.jdbc.acquisition-timeout=5S
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.jdbc.timezone=UTC
quarkus.otel.sdk.disabled=true
quarkus.package.jar.type=fast-jar
quarkus.http.port=8080
quarkus.management.enabled=true
quarkus.management.port=9000
quarkus.management.test-port=9001
quarkus.shutdown.timeout=10S
quarkus.swagger-ui.always-include=false
quarkus.log.console.json.enabled=true
%dev.quarkus.log.console.json.enabled=false
%test.quarkus.log.console.json.enabled=false
quarkus.jackson.write-dates-as-timestamps=false
