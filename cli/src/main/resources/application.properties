quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.enabled=false
quarkus.datasource.jdbc.url=${APP_DB_JDBC_URL:jdbc:postgresql://localhost:5432/starter}
quarkus.datasource.username=${APP_DB_USERNAME:app_runtime}
quarkus.datasource.password=${APP_DB_PASSWORD:}
quarkus.datasource.jdbc.max-size=10
quarkus.datasource.jdbc.acquisition-timeout=5S
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.jdbc.timezone=UTC
quarkus.package.jar.type=uber-jar
quarkus.package.output-name=starter-cli
quarkus.banner.enabled=false
quarkus.log.level=OFF
quarkus.log.console.stderr=true
