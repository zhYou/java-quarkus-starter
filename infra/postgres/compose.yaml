services:
  postgres:
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    ports: ["127.0.0.1:${APP_DB_PORT:-5432}:5432"]
    environment:
      POSTGRES_DB: starter
      POSTGRES_USER: bootstrap
      POSTGRES_PASSWORD: ${APP_DB_ADMIN_PASSWORD:?local admin password required}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?runtime password required}
      APP_DB_MIGRATION_PASSWORD: ${APP_DB_MIGRATION_PASSWORD:?migration password required}
    volumes:
      - data:/var/lib/postgresql
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U bootstrap -d starter"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  data:
