plugins {
    id 'java'
    id 'com.diffplug.spotless'
}
def catalog = extensions.getByType(VersionCatalogsExtension).named('libs')
group = providers.gradleProperty('group').getOrElse('io.github.zhyou')
version = providers.gradleProperty('version').getOrElse('unspecified')
java {
    toolchain { languageVersion = JavaLanguageVersion.of(25); vendor = JvmVendorSpec.ADOPTIUM }
}
dependencies {
    implementation enforcedPlatform(catalog.findLibrary('quarkus-bom').get())
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xlint:all', '-Werror'])
}
tasks.withType(Test).configureEach {
    useJUnitPlatform { excludeTags 'sharding', 'recovery', 'packaged' }
    maxParallelForks = 1
    testLogging { events 'failed', 'skipped' }
}
spotless {
    java { target 'src/**/*.java'; googleJavaFormat(catalog.findVersion('google-java-format').get().requiredVersion) }
}
