plugins {
    id 'groovy-gradle-plugin'
    alias(libs.plugins.spotless)
}
java { toolchain { languageVersion = JavaLanguageVersion.of(25); vendor = JvmVendorSpec.ADOPTIUM } }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.compilerArgs.addAll(['-Xlint:all', '-Werror']) }
tasks.withType(Test).configureEach { useJUnitPlatform(); maxParallelForks = 1 }
spotless { java { target 'src/**/*.java'; googleJavaFormat(libs.versions.google.java.format.get()) } }
dependencies {
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.launcher
    testImplementation gradleTestKit()
    implementation libs.plugins.quarkus.map { "${it.pluginId}:${it.pluginId}.gradle.plugin:${it.version}" }
    implementation libs.plugins.spotless.map { "${it.pluginId}:${it.pluginId}.gradle.plugin:${it.version}" }
}
tasks.named('test') { systemProperty 'starter.repository', rootProject.projectDir.parentFile.absolutePath }
dependencies { implementation project(':operations') }

tasks.named('test') { systemProperty 'starter.gradleUserHome', gradle.gradleUserHomeDir.absolutePath }

tasks.named('test') { systemProperty 'starter.offline', gradle.startParameter.offline }
