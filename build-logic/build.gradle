plugins {
    id 'groovy-gradle-plugin'
    alias(libs.plugins.spotless)
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.compilerArgs.addAll(['-Xlint:all', '-Werror']) }
tasks.withType(Test).configureEach { useJUnitPlatform() }
spotless { java { target 'src/**/*.java'; googleJavaFormat(libs.versions.google.java.format.get()) } }
dependencies {
    implementation project(':operations')
    implementation libs.plugins.quarkus.map { "${it.pluginId}:${it.pluginId}.gradle.plugin:${it.version}" }
    implementation libs.plugins.spotless.map { "${it.pluginId}:${it.pluginId}.gradle.plugin:${it.version}" }
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.launcher
    testImplementation gradleTestKit()
}
tasks.named('test') {
    systemProperty 'starter.repository', rootProject.projectDir.parentFile.absolutePath
    systemProperty 'starter.gradleUserHome', gradle.gradleUserHomeDir.absolutePath
    systemProperty 'starter.offline', gradle.startParameter.offline
}
tasks.named('check') { dependsOn ':operations:check' }
tasks.named('spotlessApply') { dependsOn ':operations:spotlessApply' }
