apiVersion: apps/v1
kind: Deployment
metadata:
  name: starter-server
  labels:
    app: starter-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: starter-server
  template:
    metadata:
      labels:
        app: starter-server
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: starter-server:test
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          env:
            - name: APP_DB_JDBC_URL
              valueFrom:
                secretKeyRef:
                  name: starter-database
                  key: jdbc-url
            - name: APP_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: starter-database
                  key: username
            - name: APP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: starter-database
                  key: password
          startupProbe:
            httpGet:
              path: /q/health/live
              port: management
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: management
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
